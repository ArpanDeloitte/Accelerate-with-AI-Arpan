# ============================================================
#  SonarQube / SonarCloud project configuration — QueryGenie
#  Run:  sonar-scanner  (with SONAR_TOKEN + sonar.host.url set)
# ============================================================
sonar.projectKey=odi-sql-generator
sonar.projectName=QueryGenie
sonar.projectVersion=1.0

# Analyse everything in this flat folder: the single-file frontend
# (index.html), the web server (web_app.py), the Live-DB bridge (app.py)
# and the connection test utility.
sonar.sources=.
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Exclude non-source content:
#  - instantclient.zip.001, .002, ... : split archive of vendored Oracle
#    Instant Client binaries (auto-extracted at first run, never source)
#  - instantclient/                  : the extracted binaries (git-ignored)
#  - wallet/, connections/, .env    : local-only secrets, never committed
#  - instantclient downloaded at first run by start-bridge.bat (git-ignored)
sonar.exclusions=**/*.min.js,instantclient/**,instantclient.zip.*,wallet/**,connections/**,.staging/**,**/__pycache__/**,.venv/**,*.zip

# ---------------------------------------------------------------------------
# Reviewed rule suppressions (2026-07-15).
# Everything mechanically fixable has been FIXED in code (350+ findings:
# replaceAll, Number.*, some(), braces, un-negated conditions, regex
# simplifications, 54 for...of conversions, unused vars, a11y handlers).
# The rules below are style/refactor suggestions whose "fix" requires
# restructuring working logic in a mature single-file app - a functional
# risk deliberately not taken. Each entry documents why it is safe.
# ---------------------------------------------------------------------------
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,e13,e14

# forEach->for...of: remaining sites declare per-iteration `var`s or nested
# returns; converting would change scope/closure semantics in render code.
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S7728
sonar.issue.ignore.multicriteria.e1.resourceKey=**/index.html
# "Regex too complicated": these are the natural-language parsing patterns;
# simplifying them changes what user phrases are recognised.
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S5843
sonar.issue.ignore.multicriteria.e2.resourceKey=**/index.html
# Nested ternaries live inside HTML template string expressions; extraction
# would restructure the render pipeline.
sonar.issue.ignore.multicriteria.e3.ruleKey=javascript:S3358
sonar.issue.ignore.multicriteria.e3.resourceKey=**/index.html
# Deeply nested functions / cognitive complexity / function hoisting:
# refactor-scale changes on stable, fully test-covered generators.
sonar.issue.ignore.multicriteria.e4.ruleKey=javascript:S2004
sonar.issue.ignore.multicriteria.e4.resourceKey=**/index.html
sonar.issue.ignore.multicriteria.e5.ruleKey=javascript:S3776
sonar.issue.ignore.multicriteria.e5.resourceKey=*
sonar.issue.ignore.multicriteria.e6.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.e6.resourceKey=**/app.py
sonar.issue.ignore.multicriteria.e7.ruleKey=javascript:S7721
sonar.issue.ignore.multicriteria.e7.resourceKey=**/index.html
# Intentionally-ignored exceptions are documented inline (storage/JSON
# fallbacks that degrade gracefully).
sonar.issue.ignore.multicriteria.e8.ruleKey=javascript:S2486
sonar.issue.ignore.multicriteria.e8.resourceKey=**/index.html
# Security hotspots - reviewed:
# S5852: regexes run client-side on the user's own SQL text (no server,
#        no untrusted volume input - no ReDoS surface).
sonar.issue.ignore.multicriteria.e9.ruleKey=javascript:S5852
sonar.issue.ignore.multicriteria.e9.resourceKey=**/index.html
# S2245: Math.random generates non-cryptographic UI element ids only.
sonar.issue.ignore.multicriteria.e10.ruleKey=javascript:S2245
sonar.issue.ignore.multicriteria.e10.resourceKey=**/index.html
# S4502/S5122: the DB bridge binds 127.0.0.1 only; CORS/CSRF posture is
# by design for a local single-user helper, never network-exposed.
sonar.issue.ignore.multicriteria.e11.ruleKey=python:S4502
sonar.issue.ignore.multicriteria.e11.resourceKey=**/app.py
sonar.issue.ignore.multicriteria.e12.ruleKey=python:S5122
sonar.issue.ignore.multicriteria.e12.resourceKey=**/app.py
# S5332: http:// literals are localhost startup-banner URLs.
sonar.issue.ignore.multicriteria.e13.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.e13.resourceKey=**/web_app.py
# S3353 (prefer const): loop bindings introduced by the for...of migration use
# `let` deliberately - semantics were verified against the original callbacks.
sonar.issue.ignore.multicriteria.e14.ruleKey=javascript:S3353
sonar.issue.ignore.multicriteria.e14.resourceKey=**/index.html
